name: Build and publish image

# Rebuilds the image whenever
#   - the wrapper or Dockerfile changes (push),
#   - upstream Plex publishes a new image (daily schedule),
#   - or someone triggers it by hand.
#
# The daily run is what keeps Plex itself up to date: the image is built
# FROM the upstream Plex image, so a rebuild picks up whatever Plex version
# upstream currently ships.

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - base: binhex/arch-plex:latest
            suffix: ''
          - base: lscr.io/linuxserver/plex:latest
            suffix: '-linuxserver'
    steps:
      - uses: actions/checkout@v4

      # GHCR only accepts lowercase repository paths, github.repository keeps
      # the owner's original casing.
      - name: Derive lowercase image name
        run: echo "IMAGE_PATH=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: BASE_IMAGE=${{ matrix.base }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PATH }}:latest${{ matrix.suffix }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Plex with VAAPI tone mapping instead of OpenCL (base ${{ matrix.base }})

      - name: Verify the wrapper is in place
        run: |
          docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PATH }}:latest${{ matrix.suffix }}
          docker run --rm --entrypoint /bin/sh \
            ${{ env.REGISTRY }}/${{ env.IMAGE_PATH }}:latest${{ matrix.suffix }} -c '
              set -e
              T="/usr/lib/plexmediaserver/Plex Transcoder"
              test -f "$T.orig" || { echo "original binary missing"; exit 1; }
              head -1 "$T" | grep -q "^#!/bin/bash" || { echo "wrapper not installed"; exit 1; }
              grep -q tonemap_vaapi "$T" || { echo "wrapper has no rewrite rule"; exit 1; }
              echo "wrapper verified"
            '
